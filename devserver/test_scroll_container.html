<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Html-tree devserver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Html-tree is a library for displaying a tree structure in html"
    />
    <link rel="stylesheet" href="/html_tree.css" />
    <style>
      body {
        font-size: 20px;
      }

      ul.html-tree ul.html-tree-common {
        margin-left: 128px;
      }

      #scroll-container {
        height: 200px;
        width: 400px;
        overflow-y: scroll;
        user-select: none;
        background-color: #eee;
        margin: 128px;
        padding: 8px;
      }
    </style>
  </head>

  <body>
    <div id="scroll-container">
      <div id="tree1"></div>
    </div>
  </body>
  <script src="/html_tree.js"></script>
  <script src="/example_data.js"></script>
  <script src="/devserver_scroll.js"></script>
</html>
